name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: "0"

jobs:
  hooks:
    name: Lint, format check and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned tools with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Node tooling
        run: npm ci --no-audit --no-fund

      - name: Run every pre-commit check on all tracked files
        run: mise run lint

      - name: Fail if any formatter changed a tracked file
        run: |
          if ! git diff --quiet; then
            echo "::error::Formatters produced changes. Run 'mise run format' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Scan git history for secrets
        run: gitleaks git --no-banner --redact --verbose

  gradle:
    name: Build, static analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned tools with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      - name: Set up Gradle (cache + wrapper validation)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile with Error Prone and NullAway, run Checkstyle and tests
        run: ./gradlew check --no-daemon --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
