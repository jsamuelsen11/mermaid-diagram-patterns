# hadolint: Dockerfile best practices. https://github.com/hadolint/hadolint
failure-threshold: warning
format: tty
ignored: []
override:
  error:
    - DL3002 # last USER must not be root
    - DL3006 # always tag the base image
    - DL3007 # never use :latest
    - DL3008 # pin apt package versions
    - DL3018 # pin apk package versions
    - DL3020 # use COPY instead of ADD
trustedRegistries:
  - docker.io
  - ghcr.io
  - public.ecr.aws
  - mcr.microsoft.com
