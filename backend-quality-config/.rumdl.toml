# rumdl: Markdown linter and formatter (markdownlint-compatible rule IDs).
[global]
flavor = "gfm"
line-length = 120
respect-gitignore = true
exclude = ["CHANGELOG.md", "**/build/**", "node_modules"]
disable = [
  "MD013", # line length: prose is not wrapped; editors soft-wrap
  "MD033", # inline HTML: needed for <details>, badges and alignment
]

[per-file-ignores]
"README.md" = ["MD041"] # badges before the first heading

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD007]
indent = 2

[MD024]
siblings-only = true

[MD029]
style = "ordered"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "underscore"

[MD050]
style = "asterisk"
