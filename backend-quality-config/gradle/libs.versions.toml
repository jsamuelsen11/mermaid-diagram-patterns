# Gradle version catalog. Renovate keeps these current.
[versions]
java = "25"
springBoot = "4.1.2"

# Quality tooling
spotless = "8.11.0"
palantirJavaFormat = "2.103.0"
ktfmt = "0.64"
checkstyle = "14.4.0"
errorpronePlugin = "5.2.0"
errorprone = "2.52.0"
nullaway = "0.14.3"
jspecify = "1.0.1"
dependencyUpdates = "0.67.0"

[libraries]
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
dependency-updates = { id = "com.github.ben-manes.versions", version.ref = "dependencyUpdates" }
