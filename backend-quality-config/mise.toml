# mise: pins every tool the repo needs so hooks, CI and humans run identical versions.
# Bootstrap a fresh clone with:  mise install && mise run setup
# Renovate keeps these pins current (see renovate.json).
min_version = "2026.7.0"

[tools]
# Language runtimes
java = "temurin-25.0.5+8.0.LTS"
node = "24.22.2"

# Git hooks
lefthook = "2.2.2"

# Linters and formatters (single static binaries)
actionlint = "1.7.12"
gitleaks = "8.30.1"
hadolint = "2.15.1"
rumdl = "0.3.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
typos = "1.52.1"
# The registry entry for editorconfig-checker points at a renamed release asset,
# so install straight from GitHub releases instead.
"github:editorconfig-checker/editorconfig-checker" = "4.0.2"

# Python CLIs, installed in isolated environments by uv (no system Python needed)
uv = "0.13.7"
"pipx:yamllint" = "1.38.0"
"pipx:check-jsonschema" = "0.39.0"

[env]
# Expose project-local Node CLIs (prettier, redocly, commitlint) without npx.
_.path = ["{{config_root}}/node_modules/.bin"]
# Keep Gradle quiet and fast in hooks.
GRADLE_OPTS = "-Dorg.gradle.console=plain"

[hooks]
# Runs after every `mise install`; idempotent. Guarded so it only acts at the repo root
# (lefthook would otherwise scaffold a config in whatever git repo it finds above).
postinstall = "if [ -f lefthook.yml ]; then lefthook install; fi"

# ---------------------------------------------------------------------------
# Tasks: the single source of truth for every check. Hooks and CI call these.
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Bootstrap a fresh clone: tools, Node CLIs and git hooks"
run = [
  "mise install",
  "npm ci --no-audit --no-fund",
  "lefthook install",
]

[tasks.lint]
description = "Run every pre-commit check against all tracked files (what CI runs)"
run = "lefthook run pre-commit --all-files --no-tty"

[tasks.format]
description = "Apply every formatter to all tracked files"
run = [
  "./gradlew --quiet spotlessApply",
  "prettier --write --log-level warn .",
  "rumdl check --fix .",
  "taplo format",
  "shfmt --write .",
]

[tasks.check]
description = "Full Gradle verification: compile with Error Prone, Checkstyle, tests"
run = "./gradlew check"

[tasks.test]
description = "Run the test suite"
run = "./gradlew test"

[tasks.secrets]
description = "Scan the full git history for leaked secrets"
run = "gitleaks git --no-banner --redact --verbose"

[tasks."hooks:install"]
description = "(Re)install git hooks"
run = "lefthook install --force"

[tasks."hooks:validate"]
description = "Validate lefthook.yml"
run = "lefthook validate"
